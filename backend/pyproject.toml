[project]
name = "jevathon-backend"
version = "0.1.0"
description = "On-call ticket routing orchestrator (see docs/oncall-ticket-routing.md)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "openai>=1.40",          # GMI is OpenAI-compatible
    "typesafe-sdk>=0.7",     # Jev
    "detect-secrets>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
